[package]
name = "ouaga-city"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
glam = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
