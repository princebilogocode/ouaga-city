[package]
name = "ouaga-city"
version = "1.0.0"
description = "Ouaga City - jeu en monde ouvert 3D dans les vraies rues de Ouagadougou"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
glam = "0.30"
gltf = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
